[project]
name = "myapi"
version = "0.1.0"
description = "A task management API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pytest>=9.2.0",
    "httpx>=0.28.1",
    "asgi-lifespan>=2.1.0",
    "asyncpg>=0.32.0",
]

[tool.fastapi]
entrypoint = "myapi.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "alembic>=1.20.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/myapi"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
